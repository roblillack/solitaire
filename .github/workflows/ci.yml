name: CI
on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      # The Saudade toolkit (resolved from crates.io) builds its SCTK +
      # softbuffer Wayland backends on Linux, which link libwayland and
      # libxkbcommon. X11 is loaded via dlopen at runtime, so no X11 dev
      # packages are needed. macOS / Windows need none.
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev libxkbcommon-dev pkg-config

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Lint (clippy)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      # `--all-targets` covers the unit, integration and snapshot tests, plus the
      # demo / screenshots examples (in both the recorder and live builds).
      - name: Test
        run: cargo test --workspace --all-targets --all-features

      - name: Build (release)
        run: cargo build --workspace --release
